<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Նկարի Blur Խմբագրիչ</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #f0f2f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding-bottom: 40px;
    }

    header {
        width: 100%;
        background: #fff;
        box-shadow: 0 2px 4px rgba(0,0,0,.08);
        padding: 14px 0;
        text-align: center;
        margin-bottom: 24px;
    }
    header h2 { margin: 0; font-size: 1.3rem; color: #222; }

    .controls {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
        padding: 14px 20px;
        display: flex;
        gap: 22px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }
    .control-group { display: flex; align-items: center; gap: 10px; }
    .control-group label { font-size: .9rem; font-weight: 600; color: #333; }
    .control-group output { min-width: 44px; font-size: .9rem; color: #007bff; font-weight: 700; }
    input[type="range"] { cursor: pointer; }

    button {
        padding: 8px 16px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: background .2s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #adb5bd; cursor: not-allowed; }

    /* ===== Drop Zone (նկարի UI-ի նման) ===== */
    .drop-zone {
        width: min(920px, 92vw);
        background: #f7f8fc;
        border: 2px dashed #ccd3e0;
        border-radius: 10px;
        padding: 64px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        transition: border-color .15s, background .15s;
    }
    .drop-zone.dragover { border-color: #007bff; background: #eef5ff; }
    .drop-zone svg { margin-bottom: 18px; }
    .drop-zone h2 { margin: 0 0 10px; font-size: 1.35rem; color: #111; }
    .drop-zone p { margin: 0 0 22px; color: #7b8494; font-size: .95rem; }

    #chooseFileBtn {
        background: #fff;
        color: #000;
        border: 2px solid #000;
        border-radius: 6px;
        padding: 10px 26px;
        font-size: .95rem;
        font-weight: 700;
    }
    #chooseFileBtn:hover { background: #f2f2f2; }

    .drop-error { display: none; color: #d93025; font-size: .9rem; margin-bottom: 12px; }

    /* ===== Editor ===== */
    .editor { display: none; flex-direction: column; align-items: center; }
    .canvas-wrap { position: relative; line-height: 0; }

    #canvas {
        display: block;
        max-width: min(92vw, 920px);
        max-height: 70vh;
        cursor: crosshair;           /* խաչ կուրսոր */
        background: #fff;
        box-shadow: 0 2px 12px rgba(0,0,0,.15);
        border-radius: 4px;
    }

    #selectionBox {
        position: absolute;
        display: none;
        border: 2px dashed #007bff;
        background: rgba(0, 123, 255, .18);
        pointer-events: none;
    }
</style>
</head>
<body>

<header><h2>Նկարի Blur Խմբագրիչ</h2></header>

<div class="controls">
    <div class="control-group">
        <label for="blurOpacity">Blur Transparent</label>
        <input type="range" id="blurOpacity" min="0" max="100" step="1" value="100">
        <output id="opacityValue">100%</output>
    </div>
    <button type="button" id="uploadBtn">Վերբեռնել Նկար</button>
    <button type="button" id="downloadBtn" disabled>Պահպանել</button>
</div>

<!-- HTML5 Drag & Drop Zone -->
<div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="Upload image">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#8b95a5"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V4"></path>
        <path d="M7 8l5-5 5 5"></path>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
    </svg>
    <h2>Drop an image or click to upload</h2>
    <p>Supports JPG, PNG, GIF &bull; Or paste from clipboard (Ctrl+V)</p>
    <div id="dropError" class="drop-error"></div>
    <button type="button" id="chooseFileBtn">Choose File</button>
</div>

<div id="editor" class="editor">
    <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="selectionBox"></div>
    </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(() => {
    'use strict';

    const BLUR_RADIUS = 10; // ֆիքսված blur (ուժգնության ֆունկցիան հեռացված է)

    const dropZone      = document.getElementById('dropZone');
    const chooseFileBtn = document.getElementById('chooseFileBtn');
    const fileInput     = document.getElementById('fileInput');
    const uploadBtn     = document.getElementById('uploadBtn');
    const downloadBtn   = document.getElementById('downloadBtn');
    const editor        = document.getElementById('editor');
    const canvas        = document.getElementById('canvas');
    const ctx           = canvas.getContext('2d');
    const selectionBox  = document.getElementById('selectionBox');
    const opacityInput  = document.getElementById('blurOpacity');
    const opacityValue  = document.getElementById('opacityValue');
    const dropError     = document.getElementById('dropError');

    let originalImage = null;
    let selecting = false;
    let startX = 0, startY = 0;

    opacityInput.addEventListener('input', () => {
        opacityValue.textContent = opacityInput.value + '%';
    });

    /* ================= HTML5 Drag & Drop ================= */
    ['dragenter', 'dragover'].forEach(type =>
        dropZone.addEventListener(type, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
        })
    );
    ['dragleave', 'dragend'].forEach(type =>
        dropZone.addEventListener(type, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
        })
    );
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadFile(file);
    });
    // Կանխում է բրաուզերին՝ ֆայլը բացելուց, երբ քաշում են zone-ից դուրս
    ['dragover', 'drop'].forEach(type =>
        window.addEventListener(type, e => e.preventDefault())
    );

    /* ================= Click / Paste upload ================= */
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    chooseFileBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
        fileInput.value = '';
    });

    document.addEventListener('paste', e => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (const item of items) {
            if (item.type && item.type.startsWith('image/')) {
                const file = item.getAsFile();
                if (file) loadFile(file);
                break;
            }
        }
    });

    function showError(msg) {
        dropError.textContent = msg;
        dropError.style.display = 'block';
        setTimeout(() => { dropError.style.display = 'none'; }, 3000);
    }

    function loadFile(file) {
        if (!file.type || !file.type.startsWith('image/')) {
            showError('Invalid file. Please choose an image (JPG, PNG, GIF).');
            return;
        }
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                canvas.width  = img.naturalWidth;
                canvas.height = img.naturalHeight;
                redrawBase();
                dropZone.style.display = 'none';
                editor.style.display = 'flex';
                downloadBtn.disabled = false;
            };
            img.onerror = () => showError('Failed to load image.');
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function redrawBase() {
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.filter = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0);
        ctx.restore();
    }

    /* ============ Rectangle ընտրություն + Blur ============ */
    function toCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width  / rect.width),
            y: (e.clientY - rect.top)  * (canvas.height / rect.height),
            rect
        };
    }

    canvas.addEventListener('mousedown', e => {
        if (e.button !== 0 || !originalImage) return;
        e.preventDefault();
        selecting = true;
        const p = toCanvasCoords(e);
        startX = p.x;
        startY = p.y;
        selectionBox.style.display = 'block';
        selectionBox.style.left = (e.clientX - p.rect.left) + 'px';
        selectionBox.style.top  = (e.clientY - p.rect.top)  + 'px';
        selectionBox.style.width  = '0px';
        selectionBox.style.height = '0px';
    });

    window.addEventListener('mousemove', e => {
        if (!selecting) return;
        const rect = canvas.getBoundingClientRect();
        const cx = Math.min(Math.max(e.clientX, rect.left), rect.right) - rect.left;
        const cy = Math.min(Math.max(e.clientY, rect.top),  rect.bottom) - rect.top;
        const sx = startX / canvas.width  * rect.width;
        const sy = startY / canvas.height * rect.height;
        selectionBox.style.left   = Math.min(sx, cx) + 'px';
        selectionBox.style.top    = Math.min(sy, cy) + 'px';
        selectionBox.style.width  = Math.abs(cx - sx) + 'px';
        selectionBox.style.height = Math.abs(cy - sy) + 'px';
    });

    window.addEventListener('mouseup', e => {
        if (!selecting) return;
        selecting = false;
        selectionBox.style.display = 'none';

        const p  = toCanvasCoords(e);
        const ex = Math.min(Math.max(p.x, 0), canvas.width);
        const ey = Math.min(Math.max(p.y, 0), canvas.height);
        const rx = Math.min(startX, ex);
        const ry = Math.min(startY, ey);
        const rw = Math.abs(ex - startX);
        const rh = Math.abs(ey - startY);
        if (rw < 3 || rh < 3) return; // պաշտպանում է պատահական սեղմումից
        applyBlurToRegion(rx, ry, rw, rh);
    });

    function applyBlurToRegion(x, y, w, h) {
        const alpha = parseInt(opacityInput.value, 10) / 100; // Blur Transparent %
        if (alpha <= 0) return;

        // pad-ը կանխում է blur-ի եզրային արտեֆակտները
        const pad = BLUR_RADIUS * 3;
        const sx = x - pad, sy = y - pad;
        const sw = w + pad * 2, sh = h + pad * 2;

        const tmp = document.createElement('canvas');
        tmp.width  = Math.max(1, Math.round(sw));
        tmp.height = Math.max(1, Math.round(sh));
        const tctx = tmp.getContext('2d');
        tctx.filter = 'blur(' + BLUR_RADIUS + 'px)';
        tctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        ctx.globalAlpha = alpha;
        ctx.drawImage(tmp, sx, sy);
        ctx.restore();
    }

    /* ================= Download ================= */
    downloadBtn.addEventListener('click', () => {
        const a = document.createElement('a');
        a.download = 'blurred-image.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    });
})();
</script>

</body>
</html>
