<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur This Sh*t - Clone</title>
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --border: #27272a;
            --text: #fafafa;
            --muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container { width: 100%; max-width: 800px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.05em; }
        p.subtitle { color: var(--muted); margin-bottom: 2rem; }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card);
            margin-bottom: 1.5rem;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-area.hidden { display: none; }

        .editor { display: none; width: 100%; }
        .editor.active { display: block; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { 
            width: 100%; height: auto; display: block;
            position: absolute; top: 0; left: 0;
        }
        #overlayCanvas { z-index: 2; cursor: crosshair; }
        #mainCanvas { z-index: 1; }

        .controls {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-end;
            justify-content: space-between;
        }

        .slider-group { flex: 1; min-width: 160px; text-align: left; }
        .slider-group label { display: block; color: var(--muted); font-size: 0.875rem; margin-bottom: 0.5rem; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        button {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        button:hover { opacity: 0.9; }
        button svg { width: 16px; height: 16px; fill: currentColor; }

        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-danger { background: var(--danger); color: white; }

        .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.75rem; text-align: left; }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: stretch; }
            .btn-group button { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Blur This Sh*t</h1>
    <p class="subtitle">Վերբեռնեք, ընտրեք հատվածը ուղղանկյունով, կարգավորեք blur-ը</p>

    <div class="upload-area" id="dropZone">
        <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">📁 Քաշեք նկարը այստեղ</p>
        <p style="color: var(--muted); font-size: 0.875rem;">կամ սեղմեք ընտրելու համար</p>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <div class="editor" id="editor">
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="slider-group">
                <label for="blurRange">Blur ուժգնություն: <span id="blurValue">15</span>px</label>
                <input type="range" id="blurRange" min="1" max="100" value="15">
            </div>
            <div class="slider-group">
                <label for="opacityRange">Blur Transparent: <span id="opacityValue">100</span>%</label>
                <input type="range" id="opacityRange" min="0" max="100" value="100">
            </div>
            <div class="btn-group">
                <button class="btn-danger" id="clearBtn" title="Մաքրել ընտրությունը">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Մաքրել
                </button>
                <button class="btn-secondary" id="newBtn" title="Նոր նկար">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Նոր
                </button>
                <button class="btn-primary" id="downloadBtn" title="Ներբեռնել">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    Ներբեռնել
                </button>
            </div>
        </div>
        <p class="hint">💡 Սեղմեք և քաշեք մկնիկով՝ ուղղանկյուն ընտրելու համար։ Blur Transparent-ը կարգավորում է blur-ի թափանցիկությունը։</p>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const editor = document.getElementById('editor');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const mainCanvas = document.getElementById('mainCanvas');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });
    const overlayCtx = overlayCanvas.getContext('2d');
    const blurRange = document.getElementById('blurRange');
    const blurValue = document.getElementById('blurValue');
    const opacityRange = document.getElementById('opacityRange');
    const opacityValue = document.getElementById('opacityValue');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const newBtn = document.getElementById('newBtn');

    let originalImage = null;
    let fileName = 'blurred-image.png';
    let originalData = null;
    let blurredData = null;
    let maskData = null; // Uint8Array same size as canvas, 0 or 255
    let isSelecting = false;
    let selStart = null;
    let selEnd = null;

    // === Native HTML5 Drag & Drop (dnd-core requires React/bundler, not usable in single HTML) ===
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragenter', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) return alert('Խնդրում ենք ընտրել նկար');
        fileName = file.name.replace(/\.[^/.]+$/, '') + '-blurred.png';
        const reader = new FileReader();
        reader.onload = (e) => {
            originalImage = new Image();
            originalImage.onload = initCanvas;
            originalImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function initCanvas() {
        dropZone.classList.add('hidden');
        editor.classList.add('active');

        const w = originalImage.naturalWidth;
        const h = originalImage.naturalHeight;
        mainCanvas.width = overlayCanvas.width = w;
        mainCanvas.height = overlayCanvas.height = h;

        canvasWrapper.style.paddingTop = ((h / w) * 100) + '%';

        mainCtx.drawImage(originalImage, 0, 0);
        originalData = mainCtx.getImageData(0, 0, w, h);

        // Init mask (all zeros = no blur)
        maskData = new Uint8Array(w * h);

        clearOverlay();
        renderImage();
    }

    function clearMask() {
        if (maskData) maskData.fill(0);
    }

    function clearOverlay() {
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    function renderBlurredSource() {
        const offscreen = document.createElement('canvas');
        offscreen.width = mainCanvas.width;
        offscreen.height = mainCanvas.height;
        const offCtx = offscreen.getContext('2d');
        offCtx.filter = `blur(${blurRange.value}px)`;
        offCtx.drawImage(originalImage, 0, 0);
        blurredData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
    }

    function renderImage() {
        if (!originalData || !maskData) return;

        renderBlurredSource();

        const opacity = parseInt(opacityRange.value) / 100;
        const o = originalData.data;
        const b = blurredData.data;
        const outData = mainCtx.createImageData(mainCanvas.width, mainCanvas.height);
        const d = outData.data;
        const len = maskData.length;

        for (let i = 0; i < len; i++) {
            const alpha = maskData[i] ? opacity : 0;
            const pi = i * 4;
            d[pi]     = o[pi]     * (1 - alpha) + b[pi]     * alpha;
            d[pi + 1] = o[pi + 1] * (1 - alpha) + b[pi + 1] * alpha;
            d[pi + 2] = o[pi + 2] * (1 - alpha) + b[pi + 2] * alpha;
            d[pi + 3] = 255;
        }

        mainCtx.putImageData(outData, 0, 0);
    }

    // === Rectangle Selection on Overlay Canvas ===
    function getPos(e) {
        const rect = overlayCanvas.getBoundingClientRect();
        const scaleX = overlayCanvas.width / rect.width;
        const scaleY = overlayCanvas.height / rect.height;
        const point = e.touches ? e.touches[0] : e;
        return {
            x: Math.round((point.clientX - rect.left) * scaleX),
            y: Math.round((point.clientY - rect.top) * scaleY)
        };
    }

    function startSelect(e) {
        e.preventDefault();
        isSelecting = true;
        selStart = getPos(e);
        selEnd = { ...selStart };
    }

    function updateSelect(e) {
        if (!isSelecting) return;
        e.preventDefault();
        selEnd = getPos(e);
        drawSelectionRect();
    }

    function endSelect(e) {
        if (!isSelecting) return;
        isSelecting = false;

        // Normalize rect
        const x1 = Math.min(selStart.x, selEnd.x);
        const y1 = Math.min(selStart.y, selEnd.y);
        const x2 = Math.max(selStart.x, selEnd.x);
        const y2 = Math.max(selStart.y, selEnd.y);

        // Apply to mask
        const w = mainCanvas.width;
        for (let y = y1; y <= y2; y++) {
            for (let x = x1; x <= x2; x++) {
                if (x >= 0 && x < w && y >= 0 && y < mainCanvas.height) {
                    maskData[y * w + x] = 255;
                }
            }
        }

        clearOverlay();
        renderImage();
        selStart = null;
        selEnd = null;
    }

    function drawSelectionRect() {
        clearOverlay();
        if (!selStart || !selEnd) return;

        const x = Math.min(selStart.x, selEnd.x);
        const y = Math.min(selStart.y, selEnd.y);
        const w = Math.abs(selEnd.x - selStart.x);
        const h = Math.abs(selEnd.y - selStart.y);

        overlayCtx.fillStyle = 'rgba(99, 102, 241, 0.25)';
        overlayCtx.fillRect(x, y, w, h);
        overlayCtx.strokeStyle = '#6366f1';
        overlayCtx.lineWidth = 2;
        overlayCtx.setLineDash([6, 3]);
        overlayCtx.strokeRect(x, y, w, h);
        overlayCtx.setLineDash([]);
    }

    // Mouse events
    overlayCanvas.addEventListener('mousedown', startSelect);
    window.addEventListener('mousemove', updateSelect);
    window.addEventListener('mouseup', endSelect);

    // Touch events
    overlayCanvas.addEventListener('touchstart', startSelect, { passive: false });
    window.addEventListener('touchmove', updateSelect, { passive: false });
    window.addEventListener('touchend', endSelect);

    // === Controls ===
    blurRange.addEventListener('input', () => {
        blurValue.textContent = blurRange.value;
        renderImage();
    });

    opacityRange.addEventListener('input', () => {
        opacityValue.textContent = opacityRange.value;
        renderImage();
    });

    clearBtn.addEventListener('click', () => {
        clearMask();
        clearOverlay();
        renderImage();
    });

    newBtn.addEventListener('click', () => {
        editor.classList.remove('active');
        dropZone.classList.remove('hidden');
        fileInput.value = '';
        originalImage = null;
        originalData = null;
        blurredData = null;
        maskData = null;
    });

    downloadBtn.addEventListener('click', () => {
        if (!originalData) return;
        const link = document.createElement('a');
        link.download = fileName;
        link.href = mainCanvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
