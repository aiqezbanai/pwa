<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blur Demo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://picsum.photos/1200/800') no-repeat center center/cover;
    }
    .blur-box {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #ff4081;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #e91e63;
    }
  </style>
</head>
<body>
  <div class="blur-box">
    <h1>Blur This!</h1>
    <p>Սա օրինակ է, որտեղ բլուր էֆեկտը կիրառվում է ֆոնի վրա։</p>
    <button>Click Me</button>
  </div>
</body>
</html>
