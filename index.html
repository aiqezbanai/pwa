<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur This Sh*t - Clone</title>
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --border: #27272a;
            --text: #fafafa;
            --muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.05em; }
        p.subtitle { color: var(--muted); margin-bottom: 2rem; }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card);
            margin-bottom: 1.5rem;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-area.hidden { display: none; }

        /* Editor */
        .editor { display: none; width: 100%; }
        .editor.active { display: block; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        canvas { width: 100%; height: auto; display: block; }

        .controls {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: space-between;
        }

        .slider-group { flex: 1; min-width: 200px; text-align: left; }
        .slider-group label { display: block; color: var(--muted); font-size: 0.875rem; margin-bottom: 0.5rem; }
        
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-group { display: flex; gap: 0.75rem; }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: stretch; }
            .btn-group button { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Blur This Sh*t</h1>
    <p class="subtitle">Վերբեռնեք նկար, աղոտացրեք և ներբեռնեք</p>

    <!-- Upload -->
    <div class="upload-area" id="dropZone">
        <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">📁 Քաշեք նկարը այստեղ</p>
        <p style="color: var(--muted); font-size: 0.875rem;">կամ սեղմեք ընտրելու համար</p>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <!-- Editor -->
    <div class="editor" id="editor">
        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <div class="slider-group">
                <label for="blurRange">Blur ուժգնություն: <span id="blurValue">10</span>px</label>
                <input type="range" id="blurRange" min="0" max="100" value="10">
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="resetBtn">↺ Վերականգնել</button>
                <button class="btn-primary" id="downloadBtn">⬇ Ներբեռնել</button>
            </div>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const editor = document.getElementById('editor');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const blurRange = document.getElementById('blurRange');
    const blurValue = document.getElementById('blurValue');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let originalImage = null;
    let fileName = 'blurred-image.png';

    // Upload handlers
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) return alert('Խնդրում ենք ընտրել նկար');
        fileName = file.name.replace(/\.[^/.]+$/, '') + '-blurred.png';
        
        const reader = new FileReader();
        reader.onload = (e) => {
            originalImage = new Image();
            originalImage.onload = () => {
                dropZone.classList.add('hidden');
                editor.classList.add('active');
                renderCanvas();
            };
            originalImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Render with blur
    function renderCanvas() {
        if (!originalImage) return;
        canvas.width = originalImage.naturalWidth;
        canvas.height = originalImage.naturalHeight;
        
        const blur = parseInt(blurRange.value);
        ctx.filter = `blur(${blur}px)`;
        ctx.drawImage(originalImage, 0, 0);
        ctx.filter = 'none';
        
        blurValue.textContent = blur;
    }

    blurRange.addEventListener('input', renderCanvas);

    // Reset
    resetBtn.addEventListener('click', () => {
        blurRange.value = 0;
        renderCanvas();
    });

    // Download
    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
