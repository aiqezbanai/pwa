<!DOCTYPE html>
<html lang="hy">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
 <title>PWA Blur Tool</title>
 <style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #222; color: #fff; }
  .canvas-container { position: relative; margin-top: 20px; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; }
  .controls { margin-top: 550px; display: flex; flex-direction: column; gap: 10px; width: 80%; }
 </style>
</head>
<body>

 <input type="file" id="imageLoader" accept="image/*">
 <div class="canvas-container" id="container">

  <!-- Base Image Layer -->
  <canvas id="baseCanvas"></canvas>

  <!-- Blur Layer -->
  <canvas id="blurCanvas"></canvas>
 </div>

 <div class="controls">
  <label>Blur-ի ուժգնություն: <input type="range" id="blurRange" min="1" max="30" value="10"></label>
  <label>Թափանցիկություն (Opacity): <input type="range" id="opacityRange" min="0.1" max="1" step="0.1" value="1"></label>
 </div>

<script>
 const imageLoader = document.getElementById('imageLoader');
 const baseCanvas = document.getElementById('baseCanvas');
 const blurCanvas = document.getElementById('blurCanvas');
 const baseCtx = baseCanvas.getContext('2d');
 const blurCtx = blurCanvas.getContext('2d');
 let isDrawing = false;
 let img = new Image();
 imageLoader.addEventListener('change', handleImage);
 function handleImage(e) {
  const reader = new FileReader();
  reader.onload = function(event) {
   img.onload = function() {
    baseCanvas.width = blurCanvas.width = img.width;
    baseCanvas.height = blurCanvas.height = img.height;

    // Նկարում ենք բնօրինակը
    baseCtx.drawImage(img, 0, 0);
   }
   img.src = event.target.result;
  }
  reader.readAsDataURL(e.target.files[0]);
 }

 // Մատով / Մկնիկով նկարելու իրադարձություններ (Touch Events)
 blurCanvas.addEventListener('pointerdown', () => isDrawing = true);
 blurCanvas.addEventListener('pointerup', () => isDrawing = false);
 blurCanvas.addEventListener('pointermove', drawBlur);
 function drawBlur(e) {
  if (!isDrawing) return;
  const rect = blurCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const blurVal = document.getElementById('blurRange').value;
  const opacityVal = document.getElementById('opacityRange').value;
  blurCtx.save();
  blurCtx.beginPath();
  blurCtx.arc(x, y, 25, 0, Math.PI * 2); // Մատի հպման շառավիղը (Brush size)
  blurCtx.clip();

  // Կիրառում ենք Blur filter և թափանցիկություն
  blurCtx.filter = `blur(${blurVal}px)`;
  blurCtx.globalAlpha = opacityVal;
  blurCtx.drawImage(img, 0, 0);
  blurCtx.restore();
 }
</script>
</body>

</html>
