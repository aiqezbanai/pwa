<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Editor 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #f0f2f5;
        font-family: 'Inter', sans-serif;
        padding: 0 16px 40px;
        overflow-x: hidden;
    }

    header {
        width: 100%;
        background: #fff;
        box-shadow: 0 2px 4px rgba(0,0,0,.08);
        padding: clamp(10px, 2vw, 14px) 0;
        text-align: center;
        margin-bottom: clamp(16px, 3vw, 24px);
    }
    header h2 { margin: 0; font-size: clamp(1rem, 0.8rem + 1vw, 1.3rem); color: #222; }

    .controls {
        width: 100%;
        max-width: 1080px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
        padding: clamp(10px, 2vw, 14px) clamp(12px, 3vw, 20px);
        display: none;
        gap: clamp(8px, 2vw, 16px);
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: clamp(16px, 3vw, 24px);
    }

    .controls.visible {
        display: flex;
    }

    button {
        padding: 8px 16px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        transition: background .2s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #adb5bd; cursor: not-allowed; }

    .zoom-container {
        display: none;
        width: 100%;
        max-width: 1080px;
        justify-content: center;
        align-items: center;
        gap: clamp(6px, 1.5vw, 10px);
        margin-bottom: clamp(8px, 2vw, 12px);
    }
    .zoom-container.visible {
        display: flex;
    }
    .zoom-container label,
    .zoom-container span {
        font-size: clamp(0.8rem, 2vw, 0.95rem);
        font-weight: 600;
        color: #333;
        white-space: nowrap;
    }

    .drop-zone {
        width: 100%;
        max-width: 920px;
        min-height: 280px;
        height: auto;
        background: #f7f8fc;
        border: 2px dashed #ccd3e0;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: border-color .15s, background .15s;
        position: relative;
        padding: 20px;
    }
    .drop-zone.dragover { border-color: #007bff; background: #eef5ff; }
    .drop-zone svg { margin-bottom: 18px; width: 48px; height: 48px; pointer-events: none; }
    .drop-zone h2 { margin: 0 0 10px; font-size: clamp(1rem, 3vw, 1.2rem); color: #111; pointer-events: none; }
    .drop-zone p { margin: 0 0 22px; color: #7b8494; font-size: clamp(0.8rem, 2vw, 0.9rem); pointer-events: none; }

    #chooseFileBtn {
        background: #fff;
        color: #000;
        border: 2px solid #000;
        border-radius: 6px;
        padding: 10px 26px;
        font-size: 0.9rem;
        font-weight: 700;
        pointer-events: auto;
        z-index: 2;
    }
    #chooseFileBtn:hover { background: #f2f2f2; }

    .drop-error { display: none; color: #d93025; font-size: .85rem; margin-bottom: 12px; pointer-events: none; }

    .editor { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 1080px; }

    .canvas-wrap { 
        position: relative; 
        line-height: 0; 
        width: min(92vw, 1080px);
        height: min(92vw, 1080px);
        overflow: hidden; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        background: #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 12px rgba(0,0,0,.15);
        cursor: crosshair;
    }

    .canvas-wrap.panning {
        cursor: grab;
    }

    .canvas-wrap.panning:active {
        cursor: grabbing;
    }

    #canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        transform-origin: center;
        background: #fff;
        touch-action: none;
    }

    #selectionBox {
        position: absolute;
        display: none;
        border: 2px dashed #007bff;
        background: rgba(0, 123, 255, .18);
        pointer-events: none;
    }

    .layers-panel {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: stretch;
        justify-content: center;
        margin-bottom: 12px;
        min-height: 44px;
        width: 100%;
        max-width: 1080px;
    }
    .layers-empty { font-size: .82rem; color: #8a94a4; align-self: center; }
    .layer-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid #d5dae2;
        border-radius: 6px;
        padding: 6px 8px;
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
        flex-wrap: wrap;
    }
    .layer-chip canvas { border-radius: 3px; border: 1px solid #e3e7ee; }
    .layer-chip > span.layer-name { font-size: .78rem; font-weight: 600; color: #333; white-space: nowrap; }
    .layer-opacity { display: flex; align-items: center; gap: 6px; }
    .layer-opacity label { font-size: .7rem; font-weight: 600; color: #555; white-space: nowrap; }
    .layer-opacity input[type="range"] { width: 80px; cursor: pointer; }
    .layer-opacity output { min-width: 38px; font-size: .7rem; font-weight: 700; color: #007bff; }
    .layer-delete {
        background: transparent;
        color: #d93025;
        padding: 2px 8px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.2;
    }
    .layer-delete:hover { background: #fdecea; }

    .history-bar {
        display: flex;
        gap: 12px;
        margin-top: clamp(10px, 2vw, 14px);
        margin-bottom: clamp(10px, 2vw, 14px);
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 1080px;
    }
    .history-bar button { display: inline-flex; align-items: center; gap: 8px; }
    .history-bar svg { flex: 0 0 auto; }

    @media (max-width: 600px) {
        body { padding: 0 10px 30px; }
        .controls { gap: 6px; }
        .canvas-wrap { width: 95vw; height: 95vw; }
        .layer-chip { flex-direction: column; align-items: flex-start; }
        .layer-opacity input[type="range"] { width: 100%; }
        .history-bar { gap: 6px; }
    }
</style>
</head>
<body>

<header><h2>Blur Editor 2.0</h2></header>

<div class="zoom-container" id="zoomContainer">
    <label for="zoomRange">Մասշտաբ:</label>
    <input type="range" id="zoomRange" min="10" max="500" value="100">
    <span id="zoomVal">100%</span>
</div>

<div class="controls" id="controlsSection">
    <button type="button" id="restartBtn">Հեռացնել պատկերը</button>
    <button type="button" id="downloadBtn">Ներբեռնել</button>
</div>

<div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="Upload image">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8b95a5"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V4"></path>
        <path d="M7 8l5-5 5 5"></path>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
    </svg>
    <h2>Տեղադրեք նկար կամ սեղմեք՝ վերբեռնելու համար</h2>
    <p>Աջակցում է JPG, PNG, GIF ձևաչափերին • կամ տեղադրեք (Ctrl+V) ստեղների օգնությամբ:</p>
    <div id="dropError" class="drop-error"></div>
    <button type="button" id="chooseFileBtn">Ընտրեք ֆայլ</button>
</div>

<div id="editor" class="editor">
    <div id="layersPanel" class="layers-panel" aria-label="Layers"></div>

    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div id="selectionBox"></div>
    </div>

    <div class="history-bar">
        <button type="button" id="undoBtn" title="Նախորդ (Ctrl+Z)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 14 4 9l5-5"></path>
                <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"></path>
            </svg>
            Նախորդ
        </button>
        <button type="button" id="redoBtn" title="Հաջորդ (Ctrl+Y)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 14 5-5-5-5"></path>
                <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13"></path>
            </svg>
            Հաջորդ
        </button>
    </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(() => {
    'use strict';

    const BLUR_RADIUS = 10;
    const DEFAULT_OPACITY = 500; // changed from 100 to 500 as required

    const dropZone        = document.getElementById('dropZone');
    const chooseFileBtn   = document.getElementById('chooseFileBtn');
    const fileInput       = document.getElementById('fileInput');
    const restartBtn      = document.getElementById('restartBtn');
    const downloadBtn     = document.getElementById('downloadBtn');
    const controlsSection = document.getElementById('controlsSection');
    const zoomContainer   = document.getElementById('zoomContainer');
    const zoomRange       = document.getElementById('zoomRange');
    const zoomVal         = document.getElementById('zoomVal');
    const editor          = document.getElementById('editor');
    const layersPanel     = document.getElementById('layersPanel');
    const undoBtn         = document.getElementById('undoBtn');
    const redoBtn         = document.getElementById('redoBtn');
    const canvas          = document.getElementById('canvas');
    const canvasWrap      = document.getElementById('canvasWrap');
    const ctx             = canvas.getContext('2d');
    const selectionBox    = document.getElementById('selectionBox');
    const dropError       = document.getElementById('dropError');

    let originalImage = null;
    let selecting = false;
    let panning = false;
    let spacePressed = false;
    let startX = 0, startY = 0;
    let panStartX = 0, panStartY = 0;
    let panStartPanX = 0, panStartPanY = 0;
    let panX = 0, panY = 0;
    let nextLayerId = 1;

    let layers = [];
    const history = [];
    let historyIndex = -1;

    function getAverageBackgroundColor() {
        if (!originalImage) return { r: 255, g: 255, b: 255 };
        const sampleCanvas = document.createElement('canvas');
        const sCtx = sampleCanvas.getContext('2d');
        sampleCanvas.width = 50;
        sampleCanvas.height = 50;
        sCtx.drawImage(originalImage, 0, 0, 50, 50);
        const imgData = sCtx.getImageData(0, 0, 50, 50).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < imgData.length; i += 4) {
            r += imgData[i];
            g += imgData[i+1];
            b += imgData[i+2];
            count++;
        }
        return {
            r: Math.round(r / count),
            g: Math.round(g / count),
            b: Math.round(b / count)
        };
    }

    function render() {
        if (!originalImage) return;
        ctx.save();
        ctx.filter = 'none';
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0);

        for (const r of layers) {
            // opacity now can be >100, but alpha must be clamped to 1
            const alpha = Math.min(1, r.opacity / 100);
            if (alpha <= 0) continue;
            ctx.globalAlpha = alpha;
            ctx.drawImage(r.canvas, r.x, r.y);
        }
        ctx.restore();
    }

    function commit(newLayers) {
        history.length = historyIndex + 1;
        history.push(newLayers);
        historyIndex = history.length - 1;
        layers = newLayers;
        render();
        renderLayerPanel();
        updateHistoryButtons();
    }

    function undo() {
        if (historyIndex <= 0) return;
        historyIndex--;
        layers = history[historyIndex];
        render();
        renderLayerPanel();
        updateHistoryButtons();
    }

    function redo() {
        if (historyIndex >= history.length - 1) return;
        historyIndex++;
        layers = history[historyIndex];
        render();
        renderLayerPanel();
        updateHistoryButtons();
    }

    function restart() {
        originalImage = null;
        layers = [];
        history.length = 0;
        historyIndex = -1;
        nextLayerId = 1;
        selecting = false;
        panning = false;
        spacePressed = false;
        selectionBox.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        layersPanel.innerHTML = '';
        editor.style.display = 'none';
        controlsSection.classList.remove('visible');
        zoomContainer.classList.remove('visible');
        dropZone.style.display = 'flex';
        undoBtn.disabled = true;
        redoBtn.disabled = true;
        fileInput.value = '';
        panX = 0;
        panY = 0;
        updateTransform();
    }

    function updateHistoryButtons() {
        undoBtn.disabled = historyIndex <= 0;
        redoBtn.disabled = historyIndex >= history.length - 1;
    }

    function deleteLayer(id) {
        const next = layers.filter(l => l.id !== id);
        if (next.length === layers.length) return;
        commit(next);
    }

    function setLayerOpacity(id, value) {
        const layer = layers.find(l => l.id === id);
        if (!layer) return;
        layer.opacity = parseInt(value, 10);
        render();
        const out = document.querySelector('.layer-opacity output[data-id="' + id + '"]');
        if (out) out.textContent = layer.opacity + '%';
    }

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);
    restartBtn.addEventListener('click', restart);

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' && editor.style.display === 'flex') {
            e.preventDefault();
        }
        if (e.code === 'Space' && !spacePressed) {
            spacePressed = true;
            canvasWrap.classList.add('panning');
        }
        if (!(e.ctrlKey || e.metaKey)) return;
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); undo(); }
        else if (k === 'y') { e.preventDefault(); redo(); }
    });

    document.addEventListener('keyup', e => {
        if (e.code === 'Space') {
            spacePressed = false;
            canvasWrap.classList.remove('panning');
            if (panning) {
                panning = false;
            }
        }
    });

    function updateTransform() {
        const scale = parseInt(zoomRange.value, 10) / 100;
        canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function updateZoom() {
        const val = parseInt(zoomRange.value, 10);
        zoomVal.textContent = val + '%';
        updateTransform();
    }

    zoomRange.addEventListener('input', updateZoom);

    function renderLayerPanel() {
        layersPanel.innerHTML = '';
        if (layers.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'layers-empty';
            empty.textContent = 'Շերտեր չկան';
            layersPanel.appendChild(empty);
            return;
        }
        layers.forEach(layer => {
            const chip = document.createElement('div');
            chip.className = 'layer-chip';

            const thumb = document.createElement('canvas');
            thumb.width = 44;
            thumb.height = 32;
            thumb.getContext('2d').drawImage(layer.canvas, 0, 0, 44, 32);

            const name = document.createElement('span');
            name.className = 'layer-name';
            name.textContent = 'Շերտ ' + layer.id;

            const opWrap = document.createElement('div');
            opWrap.className = 'layer-opacity';

            const opLabel = document.createElement('label');
            opLabel.textContent = '';

            const opInput = document.createElement('input');
            opInput.type = 'range';
            opInput.min = '0';
            opInput.max = '500'; // changed max from 100 to 500
            opInput.step = '1';
            opInput.value = String(layer.opacity);
            opInput.setAttribute('aria-label', 'Շերտի թափանցիկություն ' + layer.id);

            const opOutput = document.createElement('output');
            opOutput.dataset.id = String(layer.id);
            opOutput.textContent = layer.opacity + '%';

            opInput.addEventListener('input', () => setLayerOpacity(layer.id, opInput.value));

            opWrap.append(opLabel, opInput, opOutput);

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'layer-delete';
            del.title = 'Ջնջել շերտը ' + layer.id;
            del.setAttribute('aria-label', 'Ջնջել շերտը ' + layer.id);
            del.textContent = '\u00D7';
            del.addEventListener('click', () => deleteLayer(layer.id));

            chip.append(thumb, name, opWrap, del);
            layersPanel.appendChild(chip);
        });
    }

    ['dragenter', 'dragover'].forEach(type =>
        dropZone.addEventListener(type, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
        })
    );
    ['dragleave', 'dragend'].forEach(type =>
        dropZone.addEventListener(type, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
        })
    );
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadFile(file);
    });
    ['dragover', 'drop'].forEach(type =>
        window.addEventListener(type, e => e.preventDefault())
    );

    dropZone.addEventListener('click', (e) => {
        if (e.target === chooseFileBtn) return;
        fileInput.click();
    });

    chooseFileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
        fileInput.value = '';
    });

    document.addEventListener('paste', e => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (const item of items) {
            if (item.type && item.type.startsWith('image/')) {
                const file = item.getAsFile();
                if (file) loadFile(file);
                break;
            }
        }
    });

    function showError(msg) {
        dropError.textContent = msg;
        dropError.style.display = 'block';
        setTimeout(() => { dropError.style.display = 'none'; }, 3000);
    }

    function loadFile(file) {
        if (!file.type || !file.type.startsWith('image/')) {
            showError('Անվավեր ֆայլ։ Խնդրում ենք ընտրել նկար (JPG, PNG, GIF):');
            return;
        }
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                canvas.width  = img.naturalWidth;
                canvas.height = img.naturalHeight;
                nextLayerId = 1;
                history.length = 0;
                historyIndex = -1;
                commit([]);
                dropZone.style.display = 'none';
                editor.style.display = 'flex';
                controlsSection.classList.add('visible');
                zoomContainer.classList.add('visible');
                zoomRange.value = 100;
                panX = 0;
                panY = 0;
                updateZoom();
            };
            img.onerror = () => showError('Չհաջողվեց բեռնել նկարը։');
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function getPointerXY(e) {
        if (e.touches && e.touches.length) return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
        if (e.changedTouches && e.changedTouches.length) return { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY };
        return { clientX: e.clientX, clientY: e.clientY };
    }

    function toCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height),
            rect
        };
    }

    function startSelect(e) {
        if (!originalImage) return;
        if (e.type === 'mousedown' && e.button !== 0) return;
        
        if (spacePressed) {
            panning = true;
            const pt = getPointerXY(e);
            panStartX = pt.clientX;
            panStartY = pt.clientY;
            panStartPanX = panX;
            panStartPanY = panY;
            e.preventDefault();
            return;
        }

        e.preventDefault();
        selecting = true;
        const pt = getPointerXY(e);
        const p = toCanvasCoords(pt.clientX, pt.clientY);
        startX = p.x;
        startY = p.y;
        
        const wrapRect = canvasWrap.getBoundingClientRect();
        selectionBox.style.display = 'block';
        selectionBox.style.left = (pt.clientX - wrapRect.left) + 'px';
        selectionBox.style.top  = (pt.clientY - wrapRect.top)  + 'px';
        selectionBox.style.width  = '0px';
        selectionBox.style.height = '0px';
    }

    function moveSelect(e) {
        if (panning) {
            const pt = getPointerXY(e);
            const dx = pt.clientX - panStartX;
            const dy = pt.clientY - panStartY;
            panX = panStartPanX + dx;
            panY = panStartPanY + dy;
            updateTransform();
            e.preventDefault();
            return;
        }

        if (!selecting) return;
        const pt = getPointerXY(e);
        const wrapRect = canvasWrap.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();

        const cx = Math.min(Math.max(pt.clientX, canvasRect.left), canvasRect.right);
        const cy = Math.min(Math.max(pt.clientY, canvasRect.top),  canvasRect.bottom);
        
        const startClientX = canvasRect.left + (startX / canvas.width) * canvasRect.width;
        const startClientY = canvasRect.top + (startY / canvas.height) * canvasRect.height;

        selectionBox.style.left   = (Math.min(startClientX, cx) - wrapRect.left) + 'px';
        selectionBox.style.top    = (Math.min(startClientY, cy) - wrapRect.top)  + 'px';
        selectionBox.style.width  = Math.abs(cx - startClientX) + 'px';
        selectionBox.style.height = Math.abs(cy - startClientY) + 'px';
    }

    function endSelect(e) {
        if (panning) {
            panning = false;
            return;
        }

        if (!selecting) return;
        selecting = false;
        selectionBox.style.display = 'none';
        const pt = getPointerXY(e);
        const p  = toCanvasCoords(pt.clientX, pt.clientY);
        const ex = Math.min(Math.max(p.x, 0), canvas.width);
        const ey = Math.min(Math.max(p.y, 0), canvas.height);
        const rx = Math.min(startX, ex);
        const ry = Math.min(startY, ey);
        const rw = Math.abs(ex - startX);
        const rh = Math.abs(ey - startY);
        if (rw < 3 || rh < 3) return;
        addBlurRegion(Math.round(rx), Math.round(ry), Math.round(rw), Math.round(rh));
    }

    canvas.addEventListener('mousedown', startSelect);
    window.addEventListener('mousemove', moveSelect);
    window.addEventListener('mouseup', endSelect);
    canvas.addEventListener('touchstart', startSelect, { passive: false });
    window.addEventListener('touchmove', e => { if (selecting || panning) { e.preventDefault(); moveSelect(e); } }, { passive: false });
    window.addEventListener('touchend', endSelect);

    // Simple box blur implementation for reliable cross-platform blur
    function applyBoxBlur(cv, ctx, radius) {
        const w = cv.width, h = cv.height;
        const imgData = ctx.getImageData(0, 0, w, h);
        const src = imgData.data;
        const dst = new Uint8ClampedArray(src.length);
        const size = radius * 2 + 1;
        const weight = 1 / (size * size);

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let r = 0, g = 0, b = 0, a = 0;
                for (let dy = -radius; dy <= radius; dy++) {
                    const yy = Math.min(Math.max(y + dy, 0), h - 1);
                    for (let dx = -radius; dx <= radius; dx++) {
                        const xx = Math.min(Math.max(x + dx, 0), w - 1);
                        const idx = (yy * w + xx) * 4;
                        r += src[idx];
                        g += src[idx + 1];
                        b += src[idx + 2];
                        a += src[idx + 3];
                    }
                }
                const idx = (y * w + x) * 4;
                dst[idx]     = r * weight;
                dst[idx + 1] = g * weight;
                dst[idx + 2] = b * weight;
                dst[idx + 3] = a * weight;
            }
        }

        ctx.putImageData(new ImageData(dst, w, h), 0, 0);
    }

    function addBlurRegion(x, y, w, h) {
        w = Math.max(1, w);
        h = Math.max(1, h);
        const pad = BLUR_RADIUS * 2;
        const bw = w + pad * 2;
        const bh = h + pad * 2;

        const temp = document.createElement('canvas');
        temp.width = bw;
        temp.height = bh;
        const tctx = temp.getContext('2d');
        tctx.drawImage(canvas, x - pad, y - pad, bw, bh, 0, 0, bw, bh);

        applyBoxBlur(temp, tctx, BLUR_RADIUS);

        const patch = document.createElement('canvas');
        patch.width = w;
        patch.height = h;
        const pctx = patch.getContext('2d');

        // Fill with opaque background color to hide original underneath
        const bgColor = getAverageBackgroundColor();
        pctx.fillStyle = `rgb(${bgColor.r}, ${bgColor.g}, ${bgColor.b})`;
        pctx.fillRect(0, 0, w, h);
        pctx.drawImage(temp, pad, pad, w, h, 0, 0, w, h);

        commit(layers.concat([{
            id: nextLayerId++,
            x, y, w, h,
            canvas: patch,
            opacity: DEFAULT_OPACITY
        }]));
    }

    downloadBtn.addEventListener('click', () => {
        const a = document.createElement('a');
        a.download = 'Blurred-Image.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    });
})();
</script>
