<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Qez Blur Editor</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #f0f2f5;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        padding-bottom: 40px;
    }

    header {
        width: 100%;
        background: #fff;
        box-shadow: 0 2px 4px rgba(0,0,0,.08);
        padding: 14px 0;
        text-align: center;
        margin-bottom: 24px;
    }
    header h2 { margin: 0; font-size: clamp(1rem, 1rem + 1vw, 1.3rem); color: #222; }

    .controls {
        width: min(920px, 92vw);
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
        padding: 14px 20px;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    button {
        padding: 8px 16px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        transition: background .2s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #adb5bd; cursor: not-allowed; }

    /* ===== Drop Zone ===== */
    .drop-zone {
        width: min(920px, 92vw);
        background: #f7f8fc;
        border: 2px dashed #ccd3e0;
        border-radius: 10px;
        padding: clamp(32px, 6vw, 64px) 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        transition: border-color .15s, background .15s;
        position: relative;
    }
    .drop-zone.dragover { border-color: #007bff; background: #eef5ff; }
    .drop-zone svg { margin-bottom: 18px; width: clamp(40px, 8vw, 64px); height: clamp(40px, 8vw, 64px); pointer-events: none; }
    .drop-zone h2 { margin: 0 0 10px; font-size: clamp(1rem, 1rem + 1.2vw, 1.35rem); color: #111; pointer-events: none; }
    .drop-zone p { margin: 0 0 22px; color: #7b8494; font-size: clamp(.78rem, .78rem + .4vw, .95rem); pointer-events: none; }

    #chooseFileBtn {
        background: #fff;
        color: #000;
        border: 2px solid #000;
        border-radius: 6px;
        padding: 10px 26px;
        font-size: clamp(.82rem, .82rem + .3vw, .95rem);
        font-weight: 700;
        pointer-events: auto;
        z-index: 2;
    }
    #chooseFileBtn:hover { background: #f2f2f2; }

    .drop-error { display: none; color: #d93025; font-size: .85rem; margin-bottom: 12px; pointer-events: none; }

    /* ===== Editor ===== */
    .editor { display: none; flex-direction: column; align-items: center; width: 100%; }
    .canvas-wrap { position: relative; line-height: 0; max-width: 100%; }

    #canvas {
        display: block;
        width: auto;
        height: auto;
        max-width: min(92vw, 920px);
        max-height: 70vh;
        cursor: crosshair;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0,0,0,.15);
        border-radius: 4px;
        touch-action: none;
    }

    #selectionBox {
        position: absolute;
        display: none;
        border: 2px dashed #007bff;
        background: rgba(0, 123, 255, .18);
        pointer-events: none;
    }

    /* ===== Layers Group ===== */
    .layers-panel {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: stretch;
        justify-content: center;
        margin-bottom: 12px;
        min-height: 44px;
        width: min(920px, 92vw);
    }
    .layers-empty { font-size: .82rem; color: #8a94a4; align-self: center; }
    .layer-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid #d5dae2;
        border-radius: 6px;
        padding: 6px 8px;
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
        flex-wrap: wrap;
    }
    .layer-chip canvas { border-radius: 3px; border: 1px solid #e3e7ee; }
    .layer-chip > span.layer-name { font-size: .78rem; font-weight: 600; color: #333; white-space: nowrap; }
    .layer-opacity { display: flex; align-items: center; gap: 6px; }
    .layer-opacity label { font-size: .7rem; font-weight: 600; color: #555; white-space: nowrap; }
    .layer-opacity input[type="range"] { width: clamp(70px, 12vw, 90px); cursor: pointer; }
    .layer-opacity output { min-width: 38px; font-size: .7rem; font-weight: 700; color: #007bff; }
    .layer-delete {
        background: transparent;
        color: #d93025;
        padding: 2px 8px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.2;
    }
    .layer-delete:hover { background: #fdecea; }

    /* ===== Undo / Redo ===== */
    .history-bar { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
    .history-bar button { display: inline-flex; align-items: center; gap: 8px; }
    .history-bar svg { flex: 0 0 auto; }

    /* ===== Responsive / Adaptive ===== */
    @media (max-width: 600px) {
        .controls { gap: 10px; padding: 12px; }
        button { padding: 8px 12px; font-size: .82rem; }
        #canvas { max-height: 60vh; }
        .layer-chip { width: 100%; justify-content: space-between; }
        .layer-opacity input[type="range"] { flex: 1; min-width: 60px; }
    }
</style>
</head>
<body>

<header><h2>AI Qez Blur Editor</h2></header>

<div class="controls">
    <button type="button" id="restartBtn" disabled>Վերագործարկել</button>
    <button type="button" id="downloadBtn" disabled>Ներբեռնել</button>
</div>

<!-- HTML5 Drag & Drop Zone -->
<div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="Upload image">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8b95a5"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V4"></path>
        <path d="M7 8l5-5 5 5"></path>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
    </svg>
    <h2>Տեղադրեք նկար կամ սեղմեք՝ վերբեռնելու համար</h2>
    <p>Աջակցում է JPG, PNG, GIF ձևաչափերին • կամ տեղադրեք (Ctrl+V) ստեղների օգնությամբ:</p>
    <div id="dropError" class="drop-error"></div>
    <button type="button" id="chooseFileBtn">Ընտրեք ֆայլ</button>
</div>

<div id="editor" class="editor">
    <!-- Layer-ների Group-ներ -->
    <div id="layersPanel" class="layers-panel" aria-label="Layers"></div>

    <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="selectionBox"></div>
    </div>

    <!-- Undo / Redo -->
    <div class="history-bar">
        <button type="button" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 14 4 9l5-5"></path>
                <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"></path>
            </svg>
            Նախորդ
        </button>
        <button type="button" id="redoBtn" title="Redo (Ctrl+Y)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 14 5-5-5-5"></path>
                <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13"></path>
            </svg>
            Հաջորդ
        </button>
    </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(() => {
    'use strict';

    const BLUR_RADIUS = 10;
    const DEFAULT_OPACITY = 100;
    const TRANSPARENT_COLOR = '#ffffff'; // Transparent-ի գույնը՝ սպիտակ

    const dropZone      = document.getElementById('dropZone');
    const chooseFileBtn = document.getElementById('chooseFileBtn');
    const fileInput     = document.getElementById('fileInput');
    const restartBtn    = document.getElementById('restartBtn');
    const downloadBtn   = document.getElementById('downloadBtn');
    const editor        = document.getElementById('editor');
    const layersPanel   = document.getElementById('layersPanel');
    const undoBtn       = document.getElementById('undoBtn');
    const redoBtn       = document.getElementById('redoBtn');
    const canvas        = document.getElementById('canvas');
    const ctx           = canvas.getContext('2d');
    const selectionBox  = document.getElementById('selectionBox');
    const dropError     = document.getElementById('dropError');

    let originalImage = null;
    let selecting = false;
    let startX = 0, startY = 0;
    let nextLayerId = 1;

    let layers = [];
    const history = [];
    let historyIndex = -1;

    /* ================= Render ================= */
    function render() {
        if (!originalImage) return;
        ctx.save();
        ctx.filter = 'none';
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0);

        for (const r of layers) {
            const alpha = r.opacity / 100;

            // Transparent-ի գույնը սպիտակ է․ blur-ի տակից երևում է սպիտակ ֆոն
            ctx.globalAlpha = 1;
            ctx.fillStyle = TRANSPARENT_COLOR;
            ctx.fillRect(r.x, r.y, r.w, r.h);

            if (alpha <= 0) continue;
            ctx.globalAlpha = alpha;
            ctx.drawImage(r.canvas, r.x, r.y);
        }
        ctx.restore();
    }

    /* ================= History ================= */
    function commit(newLayers) {
        history.length = historyIndex + 1;
        history.push(newLayers);
        historyIndex = history.length - 1;
        layers = newLayers;
        render();
        renderLayerPanel();
        updateHistoryButtons();
    }

    function undo() {
        if (historyIndex <= 0) return;
        historyIndex--;
        layers = history[historyIndex];
        render();
        renderLayerPanel();
        updateHistoryButtons();
    }

    function redo() {
        if (historyIndex >= history.length - 1) return;
        historyIndex++;
        layers = history[historyIndex];
        render();
        renderLayerPanel();
        updateHistoryButtons();
    }

    // Վերագործարկել․ ջնջում է նկարը և վերադառնում հիմնական էջին
    function restart() {
        originalImage = null;
        layers = [];
        history.length = 0;
        historyIndex = -1;
        nextLayerId = 1;
        selecting = false;
        selectionBox.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        layersPanel.innerHTML = '';
        editor.style.display = 'none';
        dropZone.style.display = 'flex';
        downloadBtn.disabled = true;
        restartBtn.disabled = true;
        undoBtn.disabled = true;
        redoBtn.disabled = true;
        fileInput.value = '';
    }

    function updateHistoryButtons() {
        undoBtn.disabled = historyIndex <= 0;
        redoBtn.disabled = historyIndex >= history.length - 1;
    }

    function deleteLayer(id) {
        const next = layers.filter(l => l.id !== id);
        if (next.length === layers.length) return;
        commit(next);
    }

    function setLayerOpacity(id, value) {
        const layer = layers.find(l => l.id === id);
        if (!layer) return;
        layer.opacity = parseInt(value, 10);
        render();
        const out = document.querySelector('.layer-opacity output[data-id="' + id + '"]');
        if (out) out.textContent = layer.opacity + '%';
    }

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);
    restartBtn.addEventListener('click', restart);

    document.addEventListener('keydown', e => {
        if (!(e.ctrlKey || e.metaKey)) return;
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); undo(); }
        else if (k === 'y') { e.preventDefault(); redo(); }
    });

    /* ================= Layers Panel ================= */
    function renderLayerPanel() {
        layersPanel.innerHTML = '';
        if (layers.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'layers-empty';
            empty.textContent = 'No layers';
            layersPanel.appendChild(empty);
            return;
        }
        layers.forEach(layer => {
            const chip = document.createElement('div');
            chip.className = 'layer-chip';

            const thumb = document.createElement('canvas');
            thumb.width = 44;
            thumb.height = 32;
            thumb.getContext('2d').drawImage(layer.canvas, 0, 0, 44, 32);

            const name = document.createElement('span');
            name.className = 'layer-name';
            name.textContent = 'Layer ' + layer.id;

            const opWrap = document.createElement('div');
            opWrap.className = 'layer-opacity';

            const opLabel = document.createElement('label');
            opLabel.textContent = 'Transparent';

            const opInput = document.createElement('input');
            opInput.type = 'range';
            opInput.min = '0';
            opInput.max = '100';
            opInput.step = '1';
            opInput.value = String(layer.opacity);
            opInput.setAttribute('aria-label', 'Blur Transparent for Layer ' + layer.id);

            const opOutput = document.createElement('output');
            opOutput.dataset.id = String(layer.id);
            opOutput.textContent = layer.opacity + '%';

            opInput.addEventListener('input', () => setLayerOpacity(layer.id, opInput.value));

            opWrap.append(opLabel, opInput, opOutput);

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'layer-delete';
            del.title = 'Delete Layer ' + layer.id;
            del.setAttribute('aria-label', 'Delete Layer ' + layer.id);
            del.textContent = '\u00D7';
            del.addEventListener('click', () => deleteLayer(layer.id));

            chip.append(thumb, name, opWrap, del);
            layersPanel.appendChild(chip);
        });
    }

    /* ================= HTML5 Drag & Drop ================= */
    ['dragenter', 'dragover'].forEach(type =>
        dropZone.addEventListener(type, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
        })
    );
    ['dragleave', 'dragend'].forEach(type =>
        dropZone.addEventListener(type, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
        })
    );
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadFile(file);
    });
    ['dragover', 'drop'].forEach(type =>
        window.addEventListener(type, e => e.preventDefault())
    );

    /* ================= Click / Paste upload ================= */
    dropZone.addEventListener('click', (e) => {
        if (e.target === chooseFileBtn) return;
        fileInput.click();
    });

    chooseFileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
        fileInput.value = '';
    });

    document.addEventListener('paste', e => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (const item of items) {
            if (item.type && item.type.startsWith('image/')) {
                const file = item.getAsFile();
                if (file) loadFile(file);
                break;
            }
        }
    });

    function showError(msg) {
        dropError.textContent = msg;
        dropError.style.display = 'block';
        setTimeout(() => { dropError.style.display = 'none'; }, 3000);
    }

    function loadFile(file) {
        if (!file.type || !file.type.startsWith('image/')) {
            showError('Invalid file. Please choose an image (JPG, PNG, GIF).');
            return;
        }
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                canvas.width  = img.naturalWidth;
                canvas.height = img.naturalHeight;
                nextLayerId = 1;
                history.length = 0;
                historyIndex = -1;
                commit([]);
                dropZone.style.display = 'none';
                editor.style.display = 'flex';
                downloadBtn.disabled = false;
                restartBtn.disabled = false;
            };
            img.onerror = () => showError('Failed to load image.');
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    /* ============ Pointer-based Rectangle selection (mouse + touch) ============ */
    function getPointerXY(e) {
        if (e.touches && e.touches.length) return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
        if (e.changedTouches && e.changedTouches.length) return { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY };
        return { clientX: e.clientX, clientY: e.clientY };
    }

    function toCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * (canvas.width  / rect.width),
            y: (clientY - rect.top)  * (canvas.height / rect.height),
            rect
        };
    }

    function startSelect(e) {
        if (!originalImage) return;
        if (e.type === 'mousedown' && e.button !== 0) return;
        e.preventDefault();
        selecting = true;
        const pt = getPointerXY(e);
        const p = toCanvasCoords(pt.clientX, pt.clientY);
        startX = p.x;
        startY = p.y;
        selectionBox.style.display = 'block';
        selectionBox.style.left = (pt.clientX - p.rect.left) + 'px';
        selectionBox.style.top  = (pt.clientY - p.rect.top)  + 'px';
        selectionBox.style.width  = '0px';
        selectionBox.style.height = '0px';
    }

    function moveSelect(e) {
        if (!selecting) return;
        const pt = getPointerXY(e);
        const rect = canvas.getBoundingClientRect();
        const cx = Math.min(Math.max(pt.clientX, rect.left), rect.right) - rect.left;
        const cy = Math.min(Math.max(pt.clientY, rect.top),  rect.bottom) - rect.top;
        const sx = startX / canvas.width  * rect.width;
        const sy = startY / canvas.height * rect.height;
        selectionBox.style.left   = Math.min(sx, cx) + 'px';
        selectionBox.style.top    = Math.min(sy, cy) + 'px';
        selectionBox.style.width  = Math.abs(cx - sx) + 'px';
        selectionBox.style.height = Math.abs(cy - sy) + 'px';
    }

    function endSelect(e) {
        if (!selecting) return;
        selecting = false;
        selectionBox.style.display = 'none';
        const pt = getPointerXY(e);
        const p  = toCanvasCoords(pt.clientX, pt.clientY);
        const ex = Math.min(Math.max(p.x, 0), canvas.width);
        const ey = Math.min(Math.max(p.y, 0), canvas.height);
        const rx = Math.min(startX, ex);
        const ry = Math.min(startY, ey);
        const rw = Math.abs(ex - startX);
        const rh = Math.abs(ey - startY);
        if (rw < 3 || rh < 3) return;
        addBlurRegion(Math.round(rx), Math.round(ry), Math.round(rw), Math.round(rh));
    }

    canvas.addEventListener('mousedown', startSelect);
    window.addEventListener('mousemove', moveSelect);
    window.addEventListener('mouseup', endSelect);
    canvas.addEventListener('touchstart', startSelect, { passive: false });
    window.addEventListener('touchmove', e => { if (selecting) { e.preventDefault(); moveSelect(e); } }, { passive: false });
    window.addEventListener('touchend', endSelect);

    function addBlurRegion(x, y, w, h) {
        w = Math.max(1, w);
        h = Math.max(1, h);
        const pad = BLUR_RADIUS * 3;
        const bw = w + pad * 2, bh = h + pad * 2;

        const big = document.createElement('canvas');
        big.width = bw;
        big.height = bh;
        const bctx = big.getContext('2d');
        bctx.filter = 'blur(' + BLUR_RADIUS + 'px)';
        bctx.drawImage(canvas, x - pad, y - pad, bw, bh, 0, 0, bw, bh);
        bctx.filter = 'none';

        const patch = document.createElement('canvas');
        patch.width = w;
        patch.height = h;
        patch.getContext('2d').drawImage(big, pad, pad, w, h, 0, 0, w, h);

        commit(layers.concat([{
            id: nextLayerId++,
            x, y, w, h,
            canvas: patch,
            opacity: DEFAULT_OPACITY
        }]));
    }

    /* ================= Download ================= */
    downloadBtn.addEventListener('click', () => {
        const a = document.createElement('a');
        a.download = 'blurred-image.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    });
})();
</script>

</body>
</html>
